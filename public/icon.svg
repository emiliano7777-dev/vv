<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071120" />
      <stop offset="50%" stop-color="#0B1E3F" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="4 6" />
    <circle cx="256" cy="256" r="220" fill="none" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="256" y1="80" x2="256" y2="432" />
  </g>

  <!-- Modern Tooth Silhouette with Digital Medical Aesthetics -->
  <g transform="translate(256, 250)">
    <!-- Outer Glow Silhouette -->
    <path d="M -90 -120 
             C -35 -145, 0 -105, 0 -105 
             C 0 -105, 35 -145, 90 -120 
             C 135 -100, 140 -35, 130 30 
             C 120 95, 95 155, 60 170 
             C 30 183, 15 145, 10 100 
             C 6 60, -6 60, -10 100 
             C -15 145, -30 183, -60 170 
             C -95 155, -120 95, -130 30 
             C -140 -35, -135 -100, -90 -120 Z" 
          fill="#FFFFFF" 
          opacity="0.95"
          filter="url(#glow)" />

    <!-- Digital Tech Wave Accent on Tooth -->
    <path d="M -65 -20 
             C -30 -60, 30 -60, 65 -20
             C 50 40, -10 50, -65 -20 Z" 
          fill="url(#electricGrad)" 
          opacity="0.85" />

    <!-- Radiant Smile Arc (Sonrisa) -->
    <path d="M -70 15 Q 0 85 70 15" 
          fill="none" 
          stroke="url(#electricGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Digital Node & Warm Pulse Dot -->
    <circle cx="0" cy="52" r="7" fill="url(#accentOrange)" />
    <circle cx="-50" cy="-60" r="5" fill="#38BDF8" />
    <circle cx="50" cy="-60" r="5" fill="#38BDF8" />
    <line x1="-50" y1="-60" x2="0" y2="-90" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    <line x1="50" y1="-60" x2="0" y2="-90" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="-90" r="6" fill="#FFFFFF" />
  </g>

  <!-- Institutional Tag Ribbon / Monogram FOM -->
  <g transform="translate(256, 435)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0A192F" stroke="#38BDF8" stroke-width="2" opacity="0.9" />
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#E0F2FE">
      SONRISA FOM
    </text>
  </g>
</svg>
